<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="todo-container">
       <h1 style="text-align:center; color:rgb(23, 100, 23)">To-Do List</h1>
         <div class="container">
            <input id="task" placeholder="Enter a task">
            <button onclick="addTask()" class="primary">Add a Mission</button>
            <button onclick="changeColor()" class="secondary">Change Color</button>
        </div>
        <ul id="list"></ul>
    </div>

<h3>Total Tasks: <span id=update>0</span></h3>

<script src="to-do.js"></script>

</body>
</html>
